apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.tiktok.sparkling.method.storage'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // 直接编译 npm 包内的官方实现，避免维护一份源码副本。
            java.srcDirs = ['../../shunchang/node_modules/sparkling-storage/android/src/main/java']
            manifest.srcFile '../../shunchang/node_modules/sparkling-storage/android/src/main/AndroidManifest.xml'
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lynxsdk.lynx' && details.requested.name == 'lynx') {
            details.useVersion '4.2.0'
        }
    }
}

dependencies {
    api 'com.tiktok.sparkling:sparkling-method:2.0.1'
}
